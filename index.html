<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🎵 Music Chatroom</title>
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <link rel="stylesheet" href="./style.css" />
        <script src="./main.js" type="module"></script>
    </head>
    <body>
        <div id="app">Loading...</div>
        <template id="template">
            <header>
                <h1><router-link to="/" class="home-link">🎵 Music Chatroom</router-link></h1>
                <div class="header-actions">
                    <template v-if="$graffitiSession.value">
                        <router-link to="/explore" class="btn btn-ghost">Explore</router-link>
                        <router-link to="/search" class="btn btn-ghost">Search</router-link>
                        <router-link
                            :to="'/profile/' + $graffitiSession.value.actor"
                            class="btn btn-ghost"
                        >
                            Profile
                        </router-link>
                        <button
                            type="button"
                            class="btn btn-ghost"
                            @click="$graffiti.logout($graffitiSession.value)"
                        >
                            Log Out
                        </button>
                    </template>
                    <button v-else type="button" class="btn btn-ghost" @click="$graffiti.login()">
                        Log In
                    </button>
                </div>
            </header>

            <main>
                <div v-if="$graffitiSession.value" class="layout-container">
                    <!-- Sidebar (always shown)-->
                    <div class="sidebar">
                        <h2>Chats</h2>
                        <form class="new-chat-form" @submit.prevent="createChat()">
                            <input
                                type="text"
                                class="text-input"
                                v-model="chatTitle"
                                placeholder="New chat name"
                            />
                            <input
                                type="submit"
                                class="btn-primary"
                                :value="isCreatingChat ? 'Creating chat...' : 'Create chat'"
                                :disabled="!chatTitle || isCreatingChat"
                            />
                        </form>
                        <ul>
                            <li v-for="chat in chats" :key="chat.url">
                                <router-link
                                    :to="`/chat/${chat.value.channel}`"
                                    class="chat-item"
                                    active-class="active"
                                >
                                    {{ chat.value.title }}
                                </router-link>
                            </li>
                        </ul>
                    </div>

                    <!-- Router area -->
                    <div class="router-area">
                        <router-view></router-view>
                    </div>
                </div>

                <!-- Login prompt -->
                <div v-else class="login-prompt">
                    <div class="prompt-content">
                        <h2>Welcome to 🎵 Music Chatroom</h2>
                        <p>Log in to join the conversation and share your favorite tunes!</p>
                    </div>
                    <div class="music-notes">
                        <div class="note">🎵</div>
                        <div class="note">🎶</div>
                        <div class="note">🎼</div>
                        <div class="note">🎵</div>
                    </div>
                </div>

            </main>
        </template>
    </body>
</html>
