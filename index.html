<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🎵 Music Chatroom</title>
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@5.0.4/dist/vue-router.esm-browser.prod.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <link rel="stylesheet" href="./style.css" />
        <script src="./main.js" type="module"></script>
    </head>
    <body>
        <div id="app">Loading...</div>
        <template id="template">
            <header>
                <h1><router-link to="/" class="home-link">🎵 Music Chatroom</router-link></h1>
                <div v-if="$graffitiSession.value" class="header-actions" :class="{ 'menu-open': isMenuOpen }" @click="isMenuOpen = false">
                    <router-link to="/explore" class="btn btn-ghost">Explore</router-link>
                    <router-link to="/search" class="btn btn-ghost">Search</router-link>
                    <router-link
                        :to="'/profile/' + $graffitiSession.value.actor"
                        class="btn btn-ghost"
                    >
                        Profile
                    </router-link>
                    <button
                        type="button"
                        class="btn btn-ghost"
                        @click="$graffiti.logout($graffitiSession.value)"
                    >
                        Log Out
                    </button>
                </div>
                <button v-if="$graffitiSession.value" class="menu-toggle" @click="isMenuOpen = !isMenuOpen">
                    &#9776;
                </button>
            </header>

            <main>
                <div v-if="$graffitiSession.value" class="layout-container">
                    <!-- Sidebar (always shown)-->
                    <div class="sidebar" :class="{ 'collapsed': !isSidebarOpen }">
                        <div class="sidebar-header">
                            <h2 @click="isSidebarOpen = !isSidebarOpen" class="sidebar-title">
                                <span class="sidebar-toggle-icon">{{ isSidebarOpen ? '▼' : '▶' }}</span>
                                Chats
                            </h2>
                            <button v-if="isSidebarOpen" type="button" class="btn-icon" @click="isCreatingChatModalOpen = true" title="Create New Chat" style="font-size: 1.5rem;">
                                +
                            </button>
                        </div>
                        <ul v-show="isSidebarOpen">
                            <li v-for="chat in chats" :key="chat.url">
                                <router-link
                                    :to="`/chat/${chat.value.channel}`"
                                    class="chat-item"
                                    active-class="active"
                                >
                                    {{ chat.value.title }}
                                </router-link>
                            </li>
                        </ul>
                    </div>

                    <!-- Router area -->
                    <div class="router-area">
                        <router-view></router-view>
                    </div>

                    <!-- Create Chat Modal -->
                    <div v-if="isCreatingChatModalOpen" class="modal-overlay" @click.self="isCreatingChatModalOpen = false">
                        <div class="modal">
                            <div class="modal-header">
                                <h3>Create New Chat</h3>
                                <button type="button" class="btn-icon" @click="isCreatingChatModalOpen = false">&times;</button>
                            </div>
                            <form class="new-chat-form" @submit.prevent="createChat()">
                                <input
                                    type="text"
                                    class="text-input"
                                    v-model="chatTitle"
                                    placeholder="Enter chat name..."
                                />
                                <div class="modal-actions">
                                    <button type="button" class="btn-ghost" @click="isCreatingChatModalOpen = false">Cancel</button>
                                    <input
                                        type="submit"
                                        class="btn-primary"
                                        :value="isCreatingChat ? 'Creating...' : 'Create Chat'"
                                        :disabled="!chatTitle || isCreatingChat"
                                    />
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Login prompt -->
                <div v-else class="login-prompt">
                    <div class="prompt-content">
                        <h2>Welcome to 🎵 Music Chatroom</h2>
                        <p>Log in to join the conversation and share your favorite tunes!</p>
                        <div class="login-action-wrapper">
                            <span class="note">🎵</span>
                            <button type="button" class="btn-primary" @click="$graffiti.login()">
                                Log In
                            </button>
                            <span class="note">🎶</span>
                        </div>
                    </div>
                </div>

            </main>
        </template>
    </body>
</html>
