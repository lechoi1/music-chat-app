<div class="router-area-top">
    <div class="chat-header-info">
        <h2>{{ chatName || 'Messages' }}</h2>
        <button
            v-if="isJoined"
            type="button"
            class="btn-icon btn-edit"
            @click="editChatName"
            title="Edit chat name"
        >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
        </button>
    </div>
    <button
        type="button"
        class="btn"
        :class="isJoined ? 'btn-leave' : 'btn-join'"
        @click="toggleJoin"
        :disabled="isTogglingJoin"
    >
        {{ isTogglingJoin ? '...' : (isJoined ? 'Leave Chat' : 'Join Chat') }}
    </button>
</div>

<div class="message-transcript">

    <!-- Messages -->
    <div class="message-list">
        <div
            v-if="areMessageObjectsLoading"
            class="transcript-status"
        >
            <em>Loading messages...</em>
        </div>
        <div
            v-else-if="sortedMessageObjects.length === 0"
            class="transcript-status"
        >
            No messages yet — say hi and start the chat.
        </div>
        <ul
            v-else
            class="message-list"
        >
            <chat-message
                v-for="msg in sortedMessageObjects" 
                :key="msg.url" 
                :msg="msg"
                :all-existing-genres="allExistingGenres"
                />
            <li ref="bottomMarker" style="list-style: none;"></li>
        </ul>
    </div>

    <!-- Input text field -->
    <form v-if="isJoined" class="composer" @submit.prevent="sendMessage()">
        <div class="mode-toggle-container">
            <span class="mode-label" :class="{ 'is-active': !isMusicMode }">Text</span>
            <label class="ios-switch">
                <input type="checkbox" v-model="isMusicMode">
                <span class="slider round"></span>
            </label>
            <span class="mode-label" :class="{ 'is-active': isMusicMode }">Music</span>
        </div>

        <input 
            type="text"
            class="text-input"
            v-model="message"
            :placeholder="isMusicMode ? 'Share a song...' : 'Send a message...'"
            aria-label="Message text"
            :disabled="isSending"
        />
        
        <div class="genre-selection" v-show="isMusicMode">
            <button
                type="button"
                class="btn-ghost genre-add-button"
                @click="addCustomGenreField"
                :disabled="isSending"
            >
                + Genre
            </button>
            <button
                type="button"
                class="btn-ghost genre-add-button"
                @click="isGenreModalOpen = true"
                :disabled="isSending"
            >
                See all genres
            </button>
            <div class="genre-scroll-area">
                <template v-if="lastCustomGenre">
                    <span class="genre-last-heading">Your last used custom genre:</span>
                    <label class="genre-tag">
                        <input type="checkbox" :value="lastCustomGenre" v-model="selectedFromModal" :disabled="isSending">
                        {{ lastCustomGenre }}
                    </label>
                </template>

                <div class="genre-divider"></div>

                <label v-for="genre in predefinedGenres" :key="genre" class="genre-tag">
                    <input type="checkbox" :value="genre" v-model="selectedFromModal" :disabled="isSending">
                    {{ genre }}
                </label>

                <label v-for="genre in selectedCommunityGenres" :key="genre" class="genre-tag">
                    <input type="checkbox" :value="genre" v-model="selectedFromModal" :disabled="isSending">
                    {{ genre }}
                </label>
                <div v-for="customGenre in customGenres" :key="customGenre.id" class="genre-tag custom-genre-field">
                    <label>
                        <input type="checkbox" v-model="customGenre.checked" :disabled="isSending">
                    </label>
                    <input
                        type="text"
                        v-model="customGenre.value"
                        placeholder="Custom genre"
                        class="text-input genre-input"
                        :disabled="isSending"
                    >
                    <button
                        v-if="customGenres.length > 1"
                        type="button"
                        class="btn-delete"
                        @click="removeCustomGenreField(customGenre.id)"
                        :disabled="isSending"
                    >x</button>
                </div>
            </div>
        </div>

        <button
            type="submit"
            class="btn-primary"
            :disabled="isSending || !message || (isMusicMode && selectedFromModal.length === 0 && !customGenres.some(g => g.checked))"
        >
            {{ isSending ? 'Sending...' : 'Send' }}
        </button>
    </form>

    <div v-else class="composer-placeholder">
        <em>Join the chat to start messaging</em>
    </div>

    <!-- Genre Modal -->
    <div v-if="isGenreModalOpen" class="modal-overlay" @click.self="isGenreModalOpen = false">
        <div class="modal">
            <div class="modal-header">
                <h3>All Genres</h3>
                <button type="button" class="btn-icon" @click="isGenreModalOpen = false">&times;</button>
            </div>
            <div class="genre-modal-list">
                <label v-for="genre in allExistingGenres" :key="genre" class="genre-tag">
                    <input type="checkbox" :value="genre" v-model="selectedFromModal">
                    {{ genre }}
                </label>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-primary" @click="isGenreModalOpen = false">Done</button>
            </div>
        </div>
    </div>
</div>
